name: Frontend Gate

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'project/specs/**'
      - 'backend/**'
      - '.github/workflows/bdd-gate.yml'
      - '.github/workflows/deploy-gcp.yml'
      - 'exam-bank/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'project/specs/**'
      - 'backend/**'
      - '.github/workflows/bdd-gate.yml'
      - '.github/workflows/deploy-gcp.yml'
      - 'exam-bank/**'

concurrency:
  group: frontend-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    name: TypeScript strict (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
