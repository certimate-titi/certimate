name: Deploy to GCP

on:
  push:
    branches: [ main, production ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'project/specs/**'
      - 'project/features/**'
  workflow_dispatch:  # Manual trigger

# 同 ref 上的舊 deploy 自動取消（避免快速合並時觸發兩次部署，浪費 ~5-6 min/run）
concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false  # 部署不可中斷（避免半途死，產生 broken state）

env:
  GCP_PROJECT_ID: certimate-titi
  GCP_REGION: asia-east1
  SERVICE_NAME: certimate-titi
  AR_REPO: certimate
  DB_INSTANCE: certimate-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # ========================================
      # 1. Checkout code
      # ========================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ========================================
      # 2. Set up Cloud SDK
      # ========================================
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ========================================
      # 3. Configure Docker for Artifact Registry
      # ========================================
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      # ========================================
      # 3.5 Sync data to GCS (考古題 JSON + Prompt templates)
      # ========================================
      - name: Upload exam questions to GCS
        run: |
          gsutil -m rsync -r -x '.*_pdf/.*|.*_backup.*|.*__pycache__.*' \
            backend/data/historical_questions/ \
            gs://certimate-titi-data/historical_questions/
        continue-on-error: true

      - name: Upload prompt templates to GCS
        run: |
          if [ -d "project/03_Research_and_Development/03_Prompt_Templates" ]; then
            gsutil -m rsync -r \
              project/03_Research_and_Development/03_Prompt_Templates/ \
              gs://certimate-titi-data/prompt_templates/
          fi
        continue-on-error: true

      # ========================================
      # 4. Build and push Docker image (Backend)
      # ========================================
      - name: Get commit hash
        id: commit
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          DOCKER_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.commit.outputs.short_sha }}"
          DOCKER_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest"

          docker build -t $DOCKER_IMAGE -t $DOCKER_LATEST -f backend/Dockerfile backend/
          docker push $DOCKER_IMAGE
          docker push $DOCKER_LATEST

      # ========================================
      # 5. Deploy Backend to Cloud Run
      # ========================================
      # NOTE: GCP Billing Export environment variables are set with:
      #   GCP_BILLING_MODE=fake (development mode - returns stub data)
      # To enable real mode in production:
      #   1. Set GCP_BILLING_MODE=real via gcloud
      #   2. Mount Service Account key via Workload Identity
      #   3. Ensure GCP_BQ_CREDENTIALS_PATH is configured
      # See docs/GCP_BILLING_EXPORT_SETUP.md for deployment instructions
      - name: Deploy backend to Cloud Run
        run: |
          DOCKER_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.commit.outputs.short_sha }}"

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=$DOCKER_IMAGE \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=certimate-titi-runtime@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=2 \
            --concurrency=80 \
            --timeout=300 \
            --add-cloudsql-instances=${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.DB_INSTANCE }} \
            --set-env-vars="DATABASE_URL=postgresql+psycopg://postgres:${{ secrets.DB_PASSWORD }}@/certimate?host=/cloudsql/${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.DB_INSTANCE }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},FRONTEND_URL=https://certimate-titi.web.app,FIREBASE_PROJECT_ID=certimate-titi,GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},SMTP_HOST=smtp.gmail.com,SMTP_USER=${{ secrets.SMTP_USER }},SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }},GCP_BILLING_MODE=real,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_BILLING_EXPORT_DATASET=billing_export,GCP_BILLING_EXPORT_TABLE=gcp_billing_export_v1,BUILD_COMMIT=${{ steps.commit.outputs.short_sha }},DEPLOYED_AT=${{ steps.commit.outputs.build_time }},STORAGE_BACKEND=gcs,GCS_BUCKET=certimate-titi-data,BACKGROUND_PROCESSOR=worker,WORKER_SERVICE_URL=https://certimate-titi-worker-nfwnajqofa-de.a.run.app,WORKER_OIDC_SERVICE_ACCOUNT=certimate-titi-runtime@certimate-titi.iam.gserviceaccount.com,CLOUD_TASKS_QUEUE_NAME=resource-processing,CLOUD_TASKS_LOCATION=asia-east1,CLOUD_TASKS_PROJECT_ID=certimate-titi" \
            --set-secrets="GEMINI_API_KEY=gemini-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,VOYAGE_API_KEY=voyage-api-key:latest" \
            --quiet

      # ========================================
      # 5b. Deploy WORKER to Cloud Run（共用 image，異步 pipeline 處理）
      # ========================================
      # 接 Cloud Tasks 推送的 /api/v1/tasks/process-resource 請求；
      # main service 上傳完成後 enqueue 到 worker，避開 main 512Mi OOM。
      # 新規格：2Gi/2CPU/timeout 900/concurrency 4，scale 0-5（idle 不計費）。
      - name: Deploy worker to Cloud Run
        run: |
          DOCKER_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.commit.outputs.short_sha }}"

          gcloud run deploy ${{ env.SERVICE_NAME }}-worker \
            --image=$DOCKER_IMAGE \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --service-account=certimate-titi-runtime@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --memory=2Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=5 \
            --concurrency=4 \
            --timeout=900 \
            --add-cloudsql-instances=${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.DB_INSTANCE }} \
            --set-env-vars="DATABASE_URL=postgresql+psycopg://postgres:${{ secrets.DB_PASSWORD }}@/certimate?host=/cloudsql/${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.DB_INSTANCE }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},FRONTEND_URL=https://certimate-titi.web.app,FIREBASE_PROJECT_ID=certimate-titi,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},BUILD_COMMIT=${{ steps.commit.outputs.short_sha }},DEPLOYED_AT=${{ steps.commit.outputs.build_time }},STORAGE_BACKEND=gcs,GCS_BUCKET=certimate-titi-data,BACKGROUND_PROCESSOR=worker,WORKER_SERVICE_URL=https://certimate-titi-worker-nfwnajqofa-de.a.run.app,WORKER_OIDC_SERVICE_ACCOUNT=certimate-titi-runtime@certimate-titi.iam.gserviceaccount.com" \
            --set-secrets="GEMINI_API_KEY=gemini-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,VOYAGE_API_KEY=voyage-api-key:latest" \
            --quiet

      # ========================================
      # 6. Get backend URL
      # ========================================
      - name: Get backend URL
        id: backend
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT

      # ========================================
      # 7. Seed demo account + sync prompts
      # ========================================
      - name: Seed demo account
        run: |
          curl -X POST "${{ steps.backend.outputs.url }}/api/v1/auth/seed-demo" -H "Content-Type: application/json" || echo "Demo account seeding failed (non-blocking)"

      - name: Sync prompt templates from GCS to DB
        run: |
          # K-06 v2 等 prompt 更新需要從 GCS 同步到 DB；新 deploy 後執行
          curl -X POST "${{ steps.backend.outputs.url }}/api/v1/admin/sync-prompts" -H "Content-Type: application/json" -m 60 || echo "Prompt sync failed (non-blocking)"

      # ========================================
      # 8. Deploy Frontend to Firebase
      # ========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.backend.outputs.url }}/api/v1
          NEXT_PUBLIC_BUILD_COMMIT: ${{ steps.commit.outputs.short_sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ steps.commit.outputs.build_time }}
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Verify no localhost in build
        run: |
          if grep -rq "localhost:8000" frontend/out/_next/static/chunks/ 2>/dev/null; then
            echo "❌ Error: Build contains localhost references"
            exit 1
          fi
          echo "✓ Build verified: no localhost references"

      - name: Deploy frontend to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: certimate-titi
          entryPoint: ./frontend

      # ========================================
      # 9. Run Smoke Tests
      # ========================================
      - name: Run smoke tests
        run: |
          bash ./smoke-test.sh "${{ steps.backend.outputs.url }}"

      # ========================================
      # 10. Deployment Summary
      # ========================================
      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Deployment Successful

          | Component | URL |
          |-----------|-----|
          | **Backend** | ${{ steps.backend.outputs.url }} |
          | **Frontend** | https://certimate-titi.web.app |
          | **API Docs** | ${{ steps.backend.outputs.url }}/api/v1/docs |
          | **Commit** | ${{ steps.commit.outputs.short_sha }} |

          ### Demo Account
          - Email: `admin@certimate.com`
          - Password: `admin123`

          ### Links
          - [GCP Console](https://console.cloud.google.com/run?project=certimate-titi)
          - [Firebase Console](https://console.firebase.google.com/project/certimate-titi)
          EOF

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployment to GCP completed successfully!"
          else
            echo "❌ Deployment failed. Check the logs above."
          fi
