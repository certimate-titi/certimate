# 高普考題庫爬蟲 — 考試與科目配置
# 格式：exam_code: {category_code: [subject_codes]}
#
# 如何使用：
# 1. 在 https://wwwq.moex.gov.tw/exam/wFrmExamQandASearch.aspx 搜尋特定考試
# 2. 找到有標準答案的科目代碼（= 選擇題）
# 3. 加入此檔案下方
# 4. 執行爬蟲：python -m scripts.crawlers.moex_crawler --config exam_catalog.yaml --action download

