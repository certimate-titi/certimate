[behave]
paths = tests/features
format = pretty
color = true
; tag 分類規範見 docs/bdd/tag-conventions.md
; 過渡期：未標 tag 的 Scenario 仍會被執行（預設視為 @backend）
; 完全切換到 @backend/@fullstack 後可改為 (@backend or @fullstack) and not ...
;
; ⚠️ behave 1.3 行為陷阱（2026-04-30 揭示）：
;   - 命令列 --tags=XXX 會「完全覆蓋」default_tags（不是疊加）
;   - 因此 `behave --tags=~@ignore` 會讓 @skip / @frontend 等被誤跑
;   - 正確用法：要嘛**不傳** --tags（用 default_tags），要嘛傳完整表達式：
;     behave --tags="not @ignore and not @skip and not @frontend ..."
;   - F07 contract check 驗證：18 個 "失敗" 都是這個陷阱，加正確 tags 即消失
default_tags = not @frontend and not @playwright-e2e and not @llm-integration and not @skip and not @ignore
