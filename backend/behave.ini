[behave]
paths = tests/features
format = pretty
color = true
; tag 分類規範見 docs/bdd/tag-conventions.md
; 過渡期：未標 tag 的 Scenario 仍會被執行（預設視為 @backend）
; 完全切換到 @backend/@fullstack 後可改為 (@backend or @fullstack) and not ...
default_tags = not @frontend and not @playwright-e2e and not @llm-integration and not @skip and not @ignore
