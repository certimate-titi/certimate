
# ── 共用 ──────────────────────────────────────────────

# 所有規格產出物的根目錄
SPECS_ROOT_DIR: specs

# 澄清紀錄目錄（所有 prompt 共用，見 shared/clarify-loop.md）
CLARIFY_DIR: ${SPECS_ROOT_DIR}/clarify

# 每回合最多提問數（Sub-question 不計入）
MAX_QUESTIONS_PER_ROUND: 10

# ── discovery 用 ────────────────────────────────────

# Activity 檔案的存放目錄
ACTIVITIES_DIR: ${SPECS_ROOT_DIR}/activities

# Feature 檔案的存放目錄
FEATURE_SPECS_DIR: ${SPECS_ROOT_DIR}/features

# api.yml 的存放目錄
API_SPECS_DIR: ${SPECS_ROOT_DIR}

# erm.dbml 的存放目錄
ENTITY_SPECS_DIR: ${SPECS_ROOT_DIR}

# ── frontend automation 共用 ───────────────────────────

# TypeScript 型別目錄（純 interface，無 Zod）
TYPES_DIR: types

# API 服務層目錄
API_DIR: lib/api

# API 服務層主檔（mock data + 函式簽名即契約）
SERVICES_FILE: ${API_DIR}/services.ts

# API HTTP Client（Firebase Auth token 注入）
CLIENT_FILE: ${API_DIR}/client.ts

# ── 03-frontend-gherkin 用 ────────────────────────────

# 前端 Gherkin features（BDD 規格）
FRONTEND_FEATURES_DIR: features
