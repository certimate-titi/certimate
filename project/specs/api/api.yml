      operationId: resumeExam
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 恢復資料（已暫存答案、剩餘時間、已作答題數）
        '422':
          description: 考試狀態非 IN_PROGRESS
          content:
