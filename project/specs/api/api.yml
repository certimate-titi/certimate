      responses:
        '200':
          description: 個人資料
    put:
      tags: [Profile]
      summary: 更新個人資料
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 已更新

  /profile/avatar:
    put:
      tags: [Profile]
      summary: 上傳大頭貼
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 大頭貼已更新，回傳新 URL

  /profile/subjects:
    post:
      tags: [Profile]
      summary: 新增備考科目
      operationId: addSubject
      requestBody:
        required: true
        content:
