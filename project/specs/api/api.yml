          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswersRequest'
      responses:
        '200':
          description: 答案已儲存

  /exams/{examId}/submit:
    post:
      tags: [Exams]
      summary: 交卷
      description: 狀態 IN_PROGRESS → SUBMITTED，計算成績
      operationId: submitExam
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已交卷

