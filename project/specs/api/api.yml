openapi: 3.0.0
info:
  title: CertiMate API
  version: 1.0.0
  description: AI-powered certificate exam preparation SaaS platform

servers:
  - url: /api/v1

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Auth ID Token

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: 必要參數未提供

    # ---- Auth ----
    RegisterRequest:
      type: object
      required: [email, password, agreedToTerms]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        agreedToTerms: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    LoginResponse:
      type: object
      properties:
        token: { type: string }
        onboardingCompleted: { type: boolean }
        role: { type: string, enum: [user, org_admin, admin, super_admin] }
        subscriptionTier: { type: string, enum: [FREE, PRO_199, PRO_PLUS_399, ULTRA_1599] }

    GoogleSsoRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }

    # ---- Resources ----
    ResourceResponse:
      type: object
      properties:
        resourceId: { type: string }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, COMPLETED_NO_MAP, FAILED] }
        resourceType: { type: string, enum: [pdf, markdown, image, youtube] }
        implicitConsent: { type: boolean }
        processingEngine: { type: string, enum: [pdf_parser, markdown_parser, vision_ocr, gemini_flash] }

    YoutubeSubmitRequest:
      type: object
      required: [url, subjectId]
      properties:
        url: { type: string, format: uri }
        subjectId: { type: string }

    # ---- Knowledge ----
    KnowledgeNode:
      type: object
      properties:
        nodeId: { type: string }
        name: { type: string }
        parentId: { type: string }
        sourceType: { type: string, enum: [pdf, youtube] }
        sourceRef: { type: string }
        accuracyRate: { type: integer }
        color: { type: string, enum: [green, orange, red, gray] }

    NodeSourceResponse:
      type: object
      properties:
        nodeId: { type: string }
        content: { type: string, description: Markdown formatted source text }
        sourceType: { type: string, enum: [pdf, youtube] }
        pageNumber: { type: integer }
        timestamp: { type: string }

    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }

    # ---- Exams ----
    GenerateExamRequest:
      type: object
      required: [subjectId, nodeIds, questionCount]
      properties:
        subjectId: { type: string }
        nodeIds:
          type: array
          items: { type: string }
          minItems: 1
        questionCount: { type: integer, minimum: 1 }
        difficultyDistribution:
          type: object
          properties:
            easy: { type: number }
            medium: { type: number }
            hard: { type: number }
        questionTypes:
          type: array
          items:
            type: string
            enum: [single_choice, multiple_choice, fill_in, calculation]

    SaveAnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              selectedAnswer: { type: string }
              markedForReview: { type: boolean }

    ExamResultsResponse:
      type: object
      properties:
        examId: { type: string }
        score: { type: integer }
        totalQuestions: { type: integer }
        correctCount: { type: integer }
        incorrectCount: { type: integer }
        skippedCount: { type: integer }
        passStatus: { type: boolean }
        timeTaken: { type: integer, description: seconds }
        comparisonWithPrevious:
          type: object
          properties:
            scoreDiff: { type: integer }
            trend: { type: string, enum: [up, down, flat] }
        nodeAccuracyRates:
          type: array
          items:
            type: object
            properties:
              nodeName: { type: string }
              accuracyRate: { type: integer }
              color: { type: string, enum: [green, orange, red] }
        aiSummary: { type: string, description: PRO+ only }

    ShareCardResponse:
      type: object
      properties:
        imageUrl: { type: string, format: uri }
        displayName: { type: string }
        score: { type: integer }
        aiEncouragement: { type: string }

    # ---- Reviews ----
    ErrorQuestionResponse:
      type: object
      properties:
        questionId: { type: string }
        question: { type: string }
        correct: { type: string }
        selected: { type: string }
        nodeName: { type: string }
        tip: { type: string, description: FREE users only }
        deepAnalysisLocked: { type: boolean }
        fullAnalysis: { type: string, description: PRO+ Markdown content }
        sourceResource: { type: string }
        sourceRef: { type: string }
        upgradePrompt:
          type: object
          properties:
            targetPlan: { type: string }
            monthlyFee: { type: integer }

    # ---- Subscriptions ----
    SubscriptionInfoResponse:
      type: object
      properties:
        currentPlan: { type: string, enum: [FREE, PRO_199, PRO_PLUS_399, ULTRA_1599] }
        monthlyFee: { type: integer }
        nextBilling: { type: string, format: date, nullable: true }
        coachRemainingQuota: { type: integer }
        planComparison:
          type: array
          items:
            type: object
            properties:
              plan: { type: string }
              aiChats: { type: string }
              uploads: { type: string }
              exams: { type: string }
              visionOcr: { type: string }

    UpgradeRequest:
      type: object
      required: [targetPlan]
      properties:
        targetPlan: { type: string, enum: [PRO_199, PRO_PLUS_399, ULTRA_1599] }

    DowngradeRequest:
      type: object
      required: [targetPlan]
      properties:
        targetPlan: { type: string, enum: [FREE, PRO_199, PRO_PLUS_399] }

    InvoiceResponse:
      type: object
      properties:
        invoiceId: { type: string }
        amount: { type: integer }
        plan: { type: string }
        status: { type: string, enum: [success, failed, refunded] }
        createdAt: { type: string, format: date-time }

    # ---- Learning Schedule ----
    LearningScheduleResponse:
      type: object
      properties:
        mode: { type: string, enum: [sprint, standard, mastery] }
        subjectId: { type: string }
        daysUntilExam: { type: integer }
        recommendedQuestions:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              priority: { type: number }
              reason: { type: string }

    # ---- B2B Edu ----
    ClassHealthResponse:
      type: object
      properties:
        total: { type: integer }
        activeRate: { type: number }
        atRiskCount: { type: integer }
        avgScore: { type: number }

    AtRiskStudentResponse:
      type: object
      properties:
        studentId: { type: integer }
        name: { type: string }
        avgScore: { type: integer }
        trend: { type: string, enum: [up, down, flat] }
        weakestTopic: { type: string }
        lastActiveDays: { type: integer }

    WarningRulesRequest:
      type: object
      properties:
        minAvgScore: { type: integer }
        maxDeclineTrend: { type: integer }
        maxInactiveDays: { type: integer }

    StudentListResponse:
      type: object
      properties:
        studentId: { type: integer }
        email: { type: string }
        avgScore: { type: integer }
        trend: { type: string, enum: [up, down, flat] }

    CompetencyResponse:
      type: object
      properties:
        label: { type: string }
        score: { type: integer }
        color: { type: string, enum: [green, orange, red] }

    AiReinforcementResponse:
      type: object
      properties:
        topic: { type: string }
        suggestion: { type: string }
        actionType: { type: string, enum: [review, quiz, explore] }

    HeatmapResponse:
      type: object
      properties:
        xAxis:
          type: array
          items: { type: string }
        yAxis:
          type: array
          items: { type: string }
        cells:
          type: array
          items:
            type: array
            items: { type: integer }

    TopMistakeResponse:
      type: object
      properties:
        questionText: { type: string }
        errorRate: { type: number }
        nodeName: { type: string }

    CsvImportRequest:
      type: object
      required: [dataProcessingAgreed]
      properties:
        dataProcessingAgreed: { type: boolean }

    AssignExamRequest:
      type: object
      required: [examId, groupId, deadline]
      properties:
        examId: { type: integer }
        groupId: { type: integer }
        deadline: { type: string, format: date }

    # ---- Super Admin ----
    OperationsDashboardResponse:
      type: object
      properties:
        dau: { type: integer }
        mau: { type: integer }
        newRegistrations: { type: integer }
        conversionRate: { type: number }
        mrr: { type: number }
        aiTokenCost: { type: number }
        queueDepth: { type: integer }

    AdjustSubscriptionRequest:
      type: object
      required: [targetPlan, otpCode]
      properties:
        targetPlan: { type: string, enum: [FREE, PRO_199, PRO_PLUS_399, ULTRA_1599] }
        otpCode: { type: string }

    SuspendUserRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    ApproveRefundRequest:
      type: object
      required: [otpCode]
      properties:
        otpCode: { type: string }

    RejectRefundRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    CreatePromoCodeRequest:
      type: object
      required: [code, discountType, discountValue]
      properties:
        code: { type: string }
        discountType: { type: string, enum: [percentage, fixed_amount, free_trial_days] }
        discountValue: { type: number }
        applicablePlans:
          type: array
          items: { type: string }
        maxUses: { type: integer }
        maxUsesPerUser: { type: integer, default: 1 }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }

    ResolveReportRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [delete_and_warn, dismiss] }
        note: { type: string }

    ModelRoutingRequest:
      type: object
      properties:
        freeBasicModel: { type: string }
        freeFallbackModel: { type: string }
        proAdvancedModel: { type: string }
        proFallbackModel: { type: string }
        fallbackTimeoutMs: { type: integer }

    CreateAnnouncementRequest:
      type: object
      required: [title, content, type, displayMode]
      properties:
        title: { type: string }
        content: { type: string }
        type: { type: string, enum: [info, maintenance, feature, warning] }
        displayMode: { type: string, enum: [banner, notification, email] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    CreateFeatureFlagRequest:
      type: object
      required: [flagKey]
      properties:
        flagKey: { type: string }
        description: { type: string }
        isEnabled: { type: boolean, default: false }
        rolloutPercentage: { type: integer, minimum: 0, maximum: 100, default: 0 }
        targetPlans:
          type: array
          items: { type: string }
        targetUserIds:
          type: array
          items: { type: string }

    CreateAdminRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [super_admin, admin] }

    # ---- Dashboard ----
    DashboardResponse:
      type: object
      properties:
        examCountdown: { type: integer, description: days until exam }
        radarChart:
          type: array
          items:
            type: object
            properties:
              nodeName: { type: string }
              score: { type: integer }
        quickUpload: { type: boolean }
        todoReminders:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              description: { type: string }

    StreakResponse:
      type: object
      properties:
        currentStreak: { type: integer }
        freezeCredits: { type: integer }

    DailyQuestResponse:
      type: object
      properties:
        questType: { type: string, enum: [quiz, explore, review] }
        description: { type: string }
        xpReward: { type: integer }
        status: { type: string, enum: [pending, completed] }

    AchievementResponse:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        unlocked: { type: boolean }
        unlockedAt: { type: string, format: date-time }

    # ---- Onboarding ----
    CompleteOnboardingRequest:
      type: object
      required: [subjects]
      properties:
        displayName: { type: string }
        subjects:
          type: array
          minItems: 1
          items:
            type: object
            required: [subjectId, examDate, selfAssessedLevel]
            properties:
              subjectId: { type: string }
              examDate: { type: string, format: date }
              selfAssessedLevel: { type: string, enum: [beginner, intermediate, advanced] }
        dailyStudyMinutes: { type: integer, default: 30 }
        learningPreference: { type: string, enum: [drill, concept, mixed], default: mixed }

    # ---- Profile ----
    UpdateProfileRequest:
      type: object
      properties:
        displayName: { type: string }
        age: { type: integer }
        education: { type: string }
        career: { type: string }

    AddSubjectRequest:
      type: object
      required: [subjectId, examDate, selfAssessedLevel]
      properties:
        subjectId: { type: string }
        examDate: { type: string, format: date }
        selfAssessedLevel: { type: string, enum: [beginner, intermediate, advanced] }

    # ---- Community ----
    WeeklyReportResponse:
      type: object
      properties:
        studyHours: { type: number }
        examsCompleted: { type: integer }
        questionsAnswered: { type: integer }
        strongestNode: { type: string }
        weakestNode: { type: string }
        aiEncouragement: { type: string }

    # ---- Maintenance ----
    CreateMaintenanceTaskRequest:
      type: object
      required: [anomalyId, assigneeId, description]
      properties:
        anomalyId: { type: string }
        assigneeId: { type: string }
        description: { type: string }
        priority: { type: string, enum: [low, medium, high, critical] }

    CreateMaintenanceScheduleRequest:
      type: object
      required: [startTime, endTime, description]
      properties:
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        description: { type: string }
        affectedServices:
          type: array
          items: { type: string }

    EmergencyMaintenanceRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        estimatedDuration: { type: string }

security:
  - BearerAuth: []

# ============================================================
# API Paths
# ============================================================
paths:

  # ----------------------------------------------------------
  # 01 - Auth (身分驗證) @command
  # ----------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Email 註冊
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 註冊成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 必要參數未提供 / Email 格式無效 / 密碼不符合要求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email 已被註冊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 未同意服務條款與隱私權政策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Email 登入
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 帳號已停權
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/google-sso:
    post:
      tags: [Auth]
      summary: Google SSO 登入/自動註冊
      security: []
      operationId: googleSso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSsoRequest'
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '201':
          description: 自動建立帳號並登入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: 發送密碼重設信
      security: []
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: 重設信已發送（無論帳號是否存在）

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: 重設密碼（含驗證 token）
      security: []
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 密碼已重設
        '400':
          description: Token 無效或已過期（1小時）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/account:
    delete:
      tags: [Auth]
      summary: 刪除帳號（Right to be Forgotten）
      operationId: deleteAccount
      responses:
        '200':
          description: 帳號及所有個人資料已刪除

  # ----------------------------------------------------------
  # 02 - Resources (資源上傳) @command
  # ----------------------------------------------------------
  /resources/upload:
    post:
      tags: [Resources]
      summary: 上傳實體檔案
      description: 點擊上傳即視為同意版權免責條款。Image 僅 PRO_PLUS 以上可上傳。
      operationId: uploadResource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, subjectId]
              properties:
                file: { type: string, format: binary }
                subjectId: { type: string }
      responses:
        '201':
          description: 上傳成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: 不支援的檔案格式 / 必要參數未提供
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 手寫圖片辨識（Vision OCR）需升級至 PRO_PLUS 方案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 檔案大小超過方案限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /resources/youtube:
    post:
      tags: [Resources]
      summary: 提交 YouTube URL
      operationId: submitYoutube
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YoutubeSubmitRequest'
      responses:
        '201':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: 無效的 YouTube URL / 必要參數未提供
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # 03b - Knowledge Navigation (知識心智圖導航) @query
  # ----------------------------------------------------------
  /knowledge/nodes:
    get:
      tags: [Knowledge]
      summary: 取得知識節點樹
      operationId: getKnowledgeNodes
      parameters:
        - name: subjectId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 知識節點樹
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeNode'

  /knowledge/nodes/{nodeId}/source:
    get:
      tags: [Knowledge]
      summary: 取得節點溯源內容
      operationId: getNodeSource
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 溯源內容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeSourceResponse'

  /knowledge/nodes/{nodeId}/chat:
    post:
      tags: [Knowledge]
      summary: 與 AI 教練對話（知識節點上下文）
      description: FREE 用戶單一節點 ≤3 次追問，PRO_PLUS 以上扣除月度額度。
      operationId: chatWithCoach
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: AI 教練回應（streaming）
        '403':
          description: 方案不支援或額度已用盡
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 冷卻中（10分鐘內5次超綱觸發30分鐘冷卻）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # 04 - Exam Setup (測驗設定) @command
  # ----------------------------------------------------------
  /exams/generate:
    post:
      tags: [Exams]
      summary: 生成模擬考卷
      description: 題數限制依方案：FREE ≤10 / PRO ≤50 / ULTRA ≤100+
      operationId: generateExam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateExamRequest'
      responses:
        '201':
          description: 考卷生成任務已建立，回傳 examId
        '400':
          description: 未選擇知識節點 / 題數超過方案限制 / 必要參數未提供
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exams/{examId}/progress:
    get:
      tags: [Exams]
      summary: SSE 監聽考卷生成進度
      operationId: getExamProgress
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE 事件流（10% → 40% → 80% → 100%）
          content:
            text/event-stream: {}

  # ----------------------------------------------------------
  # 05 - Mock Exam (模擬機考) @command
  # ----------------------------------------------------------
  /exams/{examId}/start:
    post:
      tags: [Exams]
      summary: 開始考試
      description: 狀態 READY → IN_PROGRESS
      operationId: startExam
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
