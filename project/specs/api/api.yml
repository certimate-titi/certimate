            schema:
              $ref: '#/components/schemas/AddSubjectRequest'
      responses:
        '201':
          description: 科目已新增

  /profile/subjects/{subjectId}:
    put:
      tags: [Profile]
      summary: 更新備考科目設定
      operationId: updateSubject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                examDate: { type: string, format: date }
                selfAssessedLevel: { type: string, enum: [beginner, intermediate, advanced] }
      responses:
        '200':
          description: 已更新
    delete:
      tags: [Profile]
      summary: 移除備考科目（紀錄封存）
      operationId: removeSubject
      parameters:
        - name: subjectId
          in: path
