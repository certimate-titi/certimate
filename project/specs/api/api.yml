  # 11 - Resource Library (資源庫管理) @command
  # ----------------------------------------------------------
  /resources:
    get:
      tags: [Resources]
      summary: 取得資源列表
      operationId: getResources
      parameters:
        - name: subjectId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, COMPLETED_NO_MAP, FAILED]
      responses:
        '200':
          description: 資源列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceResponse'

  /resources/{resourceId}:
    delete:
      tags: [Resources]
      summary: 刪除資源
      description: COMPLETED 資源需確認級聯刪除。FAILED 資源直接刪除。
      operationId: deleteResource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: string }
        - name: confirmCascade
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: 已刪除
        '400':
          description: COMPLETED 資源未確認級聯刪除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 只能刪除自己上傳的資源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /resources/{resourceId}/reprocess:
    post:
      tags: [Resources]
      summary: 重新處理失敗的資源
      operationId: reprocessResource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已重新排入處理佇列
        '422':
          description: 資源狀態非 FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

