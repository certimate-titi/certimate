  # ----------------------------------------------------------
  # 16 - Maintenance (異常維修管理) @command
  # ----------------------------------------------------------
  /maintenance/anomalies:
    get:
      tags: [Maintenance]
      summary: 取得系統異常列表
      operationId: getAnomalies
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, investigating, resolved] }
        - name: severity
          in: query
          schema: { type: string, enum: [low, medium, high, critical] }
      responses:
        '200':
          description: 異常列表
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /maintenance/anomalies/{anomalyId}:
    patch:
      tags: [Maintenance]
      summary: 更新異常狀態
      operationId: updateAnomaly
      parameters:
        - name: anomalyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [investigating, resolved] }
                note: { type: string }
      responses:
        '200':
          description: 狀態已更新

  /maintenance/tasks:
    get:
      tags: [Maintenance]
      summary: 維修任務列表
      operationId: getMaintenanceTasks
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, in_progress, completed] }
      responses:
        '200':
          description: 任務列表
    post:
      tags: [Maintenance]
      summary: 建立維修任務
      operationId: createMaintenanceTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaintenanceTaskRequest'
      responses:
        '201':
          description: 任務已建立

  /maintenance/tasks/{taskId}:
    patch:
      tags: [Maintenance]
      summary: 更新維修任務狀態
      operationId: updateMaintenanceTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [in_progress, completed] }
                resolution: { type: string }
      responses:
        '200':
          description: 任務狀態已更新

  /maintenance/schedules:
    get:
      tags: [Maintenance]
      summary: 排程維護窗口列表
      operationId: getMaintenanceSchedules
      responses:
        '200':
          description: 排程列表
    post:
      tags: [Maintenance]
      summary: 排定維護窗口（需提前 24 小時）
      operationId: createMaintenanceSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaintenanceScheduleRequest'
      responses:
        '201':
          description: 維護窗口已排定
        '400':
          description: 維護時間必須至少提前 24 小時
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /maintenance/emergency:
    post:
      tags: [Maintenance]
      summary: 緊急維護模式啟動
      description: 全站顯示維護中頁面，所有 API 回傳 503
      operationId: activateEmergencyMaintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyMaintenanceRequest'
      responses:
        '200':
          description: 緊急維護已啟動
