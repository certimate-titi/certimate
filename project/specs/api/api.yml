openapi: 3.1.0
info:
  title: CertiMate API
  version: 0.1.0
  description: AI-powered certificate exam preparation SaaS platform

servers:
  - url: /api/v1

# ============================================================
# 共用元件
# ============================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Auth ID Token

  parameters:
    SubjectId:
      name: subjectId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: 篩選特定備考科目

  responses:
    401Unauthorized:
      description: 未登入或 Token 過期
    403Forbidden:
      description: 權限不足
    404NotFound:
      description: 資源不存在
    422ValidationError:
      description: 請求參數驗證失敗

security:
  - BearerAuth: []

# ============================================================
# API 端點
# ============================================================
paths:

  # ----------------------------------------------------------
  # 01 - 身分驗證
  # ----------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Email 註冊
      description: 建立 FREE 方案帳號，需同意服務條款
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, agreedToTerms]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                agreedToTerms: { type: boolean }
      responses:
        201: { description: 註冊成功，回傳 userId + JWT }
        409: { description: Email 已存在 }
        422: { $ref: '#/components/responses/422ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Email 登入
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        200: { description: 登入成功，回傳 JWT + onboardingCompleted + role }
        401: { description: 帳號或密碼錯誤 }
        403: { description: 帳號已停權 }

  /auth/google-sso:
    post:
      tags: [Auth]
      summary: Google SSO 登入/自動註冊
      security: []
      operationId: googleSso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        200: { description: 登入成功 }
        201: { description: 自動建立帳號並登入 }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: 發送密碼重設信
      security: []
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        200: { description: 重設信已發送（無論帳號是否存在） }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: 重設密碼（含驗證 token）
      security: []
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        200: { description: 密碼已重設 }
        400: { description: Token 無效或過期（1小時） }

  /auth/account:
    delete:
      tags: [Auth]
      summary: 刪除帳號（GDPR）
      description: 級聯刪除所有個人資料與快取
      operationId: deleteAccount
      responses:
        200: { description: 帳號已刪除 }

  # ----------------------------------------------------------
  # 02 - 資源上傳
  # ----------------------------------------------------------
  /resources/upload:
    post:
      tags: [Resources]
      summary: 上傳實體檔案（PDF/MD/TXT/Image）
      description: |
        點擊上傳即視為同意版權免責條款。
        Image（PNG/JPG/JPEG/WebP）僅 PRO_PLUS 以上方案可上傳。
        檔案大小限制：FREE 10MB / PRO+PRO_PLUS 100MB / ULTRA 無限制。
      operationId: uploadResource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, subjectId]
              properties:
                file: { type: string, format: binary }
                subjectId: { type: string, format: uuid }
      responses:
        201: { description: 上傳成功，資源狀態 PENDING }
        400: { description: 不支援的檔案格式 }
        403: { description: Image 上傳需 PRO_PLUS 方案 }
        413: { description: 檔案大小超過方案限制 }

  /resources/youtube:
    post:
      tags: [Resources]
      summary: 提交 YouTube URL
      description: 所有方案皆可使用，無時長限制
      operationId: submitYoutube
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, subjectId]
              properties:
                url: { type: string, format: uri }
                subjectId: { type: string, format: uuid }
      responses:
        201: { description: 提交成功，資源狀態 PENDING }
        400: { description: 無效的 YouTube URL }

  # ----------------------------------------------------------
  # 03a - 知識心智圖生成（系統內部，無直接 API）
  # ----------------------------------------------------------
  # 資源處理成功後由系統自動觸發，透過內部事件驅動

  # ----------------------------------------------------------
  # 03b - 知識心智圖導航
  # ----------------------------------------------------------
  /knowledge/nodes:
    get:
      tags: [Knowledge]
      summary: 取得知識節點樹
      operationId: getKnowledgeNodes
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        200: { description: 知識節點樹（含掌握度顏色） }

  /knowledge/nodes/{nodeId}/source:
    get:
      tags: [Knowledge]
      summary: 取得節點溯源內容
      description: PDF 回傳原文+頁碼，YouTube 回傳逐字稿+時間戳
      operationId: getNodeSource
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 溯源內容（Markdown 原文或影片時間戳） }

  /knowledge/nodes/{nodeId}/chat:
    post:
      tags: [Knowledge]
      summary: 與 AI 教練對話（上下文感知）
      description: |
        PRO 用戶：毛玻璃鎖死，回傳 403。
        PRO_PLUS 用戶：扣除月度額度，Claude 3.5 回應。
        FREE 用戶：單一節點 ≤3 次追問後鎖死。
      operationId: chatWithCoach
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        200: { description: AI 教練回應（streaming） }
        403: { description: 方案不支援或額度已用盡 }
        429: { description: 冷卻中（10分鐘內5次超綱觸發30分鐘冷卻） }

  # ----------------------------------------------------------
  # 04 - 測驗設定
  # ----------------------------------------------------------
  /exams/generate:
    post:
      tags: [Exams]
      summary: 生成模擬考卷
      description: |
        題數限制：FREE ≤10 / PRO ≤50 / ULTRA ≤100+。
        回傳 examId，前端透過 SSE 監聽生成進度。
      operationId: generateExam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, nodeIds, questionCount]
              properties:
                subjectId: { type: string, format: uuid }
                nodeIds:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                questionCount: { type: integer, minimum: 1 }
                difficultyDistribution:
                  type: object
                  properties:
                    easy: { type: number }
                    medium: { type: number }
                    hard: { type: number }
                questionTypes:
                  type: array
                  items:
                    type: string
                    enum: [single_choice, multiple_choice, fill_in, calculation]
      responses:
        201: { description: 考卷生成任務已建立，回傳 examId }
        400: { description: 未選擇知識節點或題數超過限制 }

  /exams/{examId}/progress:
    get:
      tags: [Exams]
      summary: SSE 監聽考卷生成進度
      operationId: getExamProgress
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: SSE 事件流（10% → 40% → 80% → 100%）
          content:
            text/event-stream: {}

  # ----------------------------------------------------------
  # 05 - 模擬機考
  # ----------------------------------------------------------
  /exams/{examId}/start:
    post:
      tags: [Exams]
      summary: 開始考試
      description: 狀態 READY → IN_PROGRESS，記錄開始時間
      operationId: startExam
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 考試已開始，回傳題目列表+倒數時間 }
        400: { description: 考試狀態非 READY }
        403: { description: 非本人考試 }

  /exams/{examId}/answers:
    put:
      tags: [Exams]
      summary: 儲存答案（Auto-save）
      operationId: saveAnswers
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      questionId: { type: string, format: uuid }
                      selectedAnswer: { type: string }
                      markedForReview: { type: boolean }
      responses:
        200: { description: 答案已儲存 }

  /exams/{examId}/submit:
    post:
      tags: [Exams]
      summary: 交卷
      description: 狀態 IN_PROGRESS → SUBMITTED，計算成績
      operationId: submitExam
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 已交卷，回傳 resultId }

  /exams/{examId}/resume:
    get:
      tags: [Exams]
      summary: 恢復考試
      description: 回傳已暫存的答案、剩餘時間、已作答題數
      operationId: resumeExam
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 恢復資料 }
        400: { description: 考試狀態非 IN_PROGRESS }

  # ----------------------------------------------------------
  # 06 - 測驗結果
  # ----------------------------------------------------------
  /exams/{examId}/results:
    get:
      tags: [Exams]
      summary: 取得測驗結果
      description: 含分數、及格狀態、知識節點答對率、與上次比較、AI 總評（PRO+）
      operationId: getExamResults
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 測驗結果完整資料 }
        403: { description: 非本人考試 }

  /exams/{examId}/results/share-card:
    get:
      tags: [Exams]
      summary: 生成分享成績卡片
      description: 含暱稱、得分、AI 鼓勵語、品牌浮水印
      operationId: getShareCard
      parameters:
        - name: examId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 成績卡片圖片 URL }

  # ----------------------------------------------------------
  # 07 - 錯題複習與 AI 教練
  # ----------------------------------------------------------
  /reviews/errors:
    get:
      tags: [Reviews]
      summary: 取得錯題清單
      operationId: getErrorQuestions
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - name: examId
          in: query
          schema: { type: string, format: uuid }
          description: 篩選特定考試的錯題
      responses:
        200: { description: 錯題列表（題目、正確答案、使用者選項、知識節點） }

  /reviews/errors/{questionId}/analysis:
    get:
      tags: [Reviews]
      summary: 取得錯題詳細解析
      description: |
        FREE：一句極簡提示。
        PRO+：完整 Markdown 解析 + KaTeX + 原文溯源 + 盲點痛擊。
      operationId: getErrorAnalysis
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 解析內容（依方案差異化） }

  /reviews/errors/{questionId}/chat:
    post:
      tags: [Reviews]
      summary: 與 AI 教練對話（錯題上下文）
      description: |
        僅 PRO 以上可用。Streaming 回應。
        10分鐘內5次超綱觸發30分鐘冷卻。
      operationId: chatAboutError
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        200: { description: AI 教練回應（streaming） }
        403: { description: FREE 方案不可用 }
        429: { description: 冷卻中 }

  # ----------------------------------------------------------
  # 08 - 訂閱管理
  # ----------------------------------------------------------
  /subscriptions/current:
    get:
      tags: [Subscriptions]
      summary: 取得當前訂閱資訊
      description: 回傳方案、下次扣款日、額度比較
      operationId: getCurrentSubscription
      responses:
        200: { description: 訂閱資訊 }

  /subscriptions/upgrade:
    post:
      tags: [Subscriptions]
      summary: 升級訂閱方案
      description: 即時生效，額度立刻切換
      operationId: upgradeSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPlan]
              properties:
                targetPlan:
                  type: string
                  enum: [PRO_199, PRO_PLUS_399, ULTRA_1599]
      responses:
        200: { description: 升級成功，導向 Stripe Checkout }
        400: { description: 不可訂閱相同方案 }

  /subscriptions/cancel:
    post:
      tags: [Subscriptions]
      summary: 取消訂閱
      description: 降級於當期結束後生效，期間功能照常使用
      operationId: cancelSubscription
      responses:
        200: { description: 已排定取消，到期後降級至 FREE }

  /subscriptions/invoices:
    get:
      tags: [Subscriptions]
      summary: 帳單歷史紀錄
      operationId: getInvoices
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        200: { description: 發票列表 }

  # ----------------------------------------------------------
  # 10 - B2B 教育機構管理
  # ----------------------------------------------------------
  /edu/class-health:
    get:
      tags: [B2B Edu]
      summary: 班級健康 KPI
      description: 總學生數、活躍率、需關注人數、班級平均分
      operationId: getClassHealth
      responses:
        200: { description: KPI 數據 }
        403: { description: 非 ULTRA + org_admin }

  /edu/at-risk:
    get:
      tags: [B2B Edu]
      summary: 早期預警學生清單
      description: 依機構自訂閾值觸發（預設：平均分<60 / 連續3次下降 / 5天未登入）
      operationId: getAtRiskStudents
      responses:
        200: { description: 預警學生清單 }

  /edu/at-risk/rules:
    get:
      tags: [B2B Edu]
      summary: 取得預警規則設定
      operationId: getWarningRules
      responses:
        200: { description: 當前閾值設定 }
    put:
      tags: [B2B Edu]
      summary: 更新預警規則設定
      operationId: updateWarningRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minAvgScore: { type: number, default: 60 }
                maxDeclineTrend: { type: integer, default: 3 }
                maxInactiveDays: { type: integer, default: 5 }
      responses:
        200: { description: 規則已更新 }

  /edu/students:
    get:
      tags: [B2B Edu]
      summary: 學生能力檔案列表
      description: 含趨勢箭頭、進度條、平均分、狀態標籤
      operationId: getStudents
      responses:
        200: { description: 學生列表 }

  /edu/students/import:
    post:
      tags: [B2B Edu]
      summary: CSV 批量匯入學生
      description: 固定欄位（姓名、Email、學號），需確認個資同意
      operationId: importStudents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, dataProcessingAgreed]
              properties:
                file: { type: string, format: binary }
                dataProcessingAgreed: { type: boolean }
      responses:
        201: { description: 匯入成功，已發送啟用信 }
        400: { description: CSV 格式錯誤或重複 Email }

  /edu/students/{studentId}/competencies:
    get:
      tags: [B2B Edu]
      summary: 單一學生多維度能力檔案
      operationId: getStudentCompetencies
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 各知識節點能力分析 }

  /edu/students/{studentId}/ai-reinforcement:
    post:
      tags: [B2B Edu]
      summary: 生成 AI 個人化補強建議
      description: Gemini API 生成繁體中文建議，快取 24 小時
      operationId: generateReinforcement
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: AI 補強建議（1-3 條） }

  /edu/assignments:
    post:
      tags: [B2B Edu]
      summary: 派發模擬考卷
      operationId: distributeExam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, examConfig, deadline]
              properties:
                groupId: { type: string, format: uuid }
                examConfig:
                  type: object
                  properties:
                    nodeIds: { type: array, items: { type: string, format: uuid } }
                    questionCount: { type: integer }
                deadline: { type: string, format: date-time }
      responses:
        201: { description: 考卷已派發 }

  /edu/analytics/heatmap:
    get:
      tags: [B2B Edu]
      summary: 班級熱力圖（知識節點 × 學生）
      operationId: getClassHeatmap
      responses:
        200: { description: 熱力圖矩陣數據 }

  /edu/analytics/weak-spots:
    get:
      tags: [B2B Edu]
      summary: 班級共同弱點分析
      operationId: getWeakSpots
      responses:
        200: { description: 共同弱點 Top N }

  /edu/analytics/top-mistakes:
    get:
      tags: [B2B Edu]
      summary: 全班答錯率 Top 10 題目
      operationId: getTopMistakes
      responses:
        200: { description: 答錯率排行 }

  /edu/institution/resources:
    get:
      tags: [B2B Edu]
      summary: 機構共享資源庫列表
      operationId: getInstitutionResources
      responses:
        200: { description: 機構資源列表 }
    post:
      tags: [B2B Edu]
      summary: 上傳機構共享資源
      description: 標記為機構資源，全班學生可存取
      operationId: uploadInstitutionResource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, subjectId]
              properties:
                file: { type: string, format: binary }
                subjectId: { type: string, format: uuid }
      responses:
        201: { description: 上傳成功 }

  # ----------------------------------------------------------
  # 11 - 資源庫管理
  # ----------------------------------------------------------
  /resources:
    get:
      tags: [Resources]
      summary: 取得資源列表
      operationId: getResources
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, COMPLETED_NO_MAP, FAILED]
      responses:
        200: { description: 資源列表（含狀態、標籤、題數） }

  /resources/{resourceId}:
    delete:
      tags: [Resources]
      summary: 刪除資源
      description: |
        COMPLETED 資源：級聯刪除 GCS 檔案、pgvector embeddings、心智圖節點、排程記錄。
        FAILED 資源：直接刪除，無級聯。
        處理失敗的資源由系統自動刪除。
      operationId: deleteResource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: confirmCascade
          in: query
          schema: { type: boolean }
          description: COMPLETED 資源需確認級聯刪除
      responses:
        200: { description: 已刪除 }
        400: { description: COMPLETED 資源未確認級聯刪除 }

  # ----------------------------------------------------------
  # 12 - 平台管理後台（Super Admin）
  # ----------------------------------------------------------
  /super-admin/dashboard:
    get:
      tags: [Super Admin]
      summary: 營運儀表板 KPI
      description: DAU/MAU、新註冊數、轉換率、MRR、AI Token 消耗、佇列深度
      operationId: getOperationsDashboard
      responses:
        200: { description: KPI 數據 }
        403: { $ref: '#/components/responses/403Forbidden' }

  /super-admin/dashboard/trends:
    get:
      tags: [Super Admin]
      summary: 趨勢圖表資料
      description: 用戶成長、營收、AI 成本、系統負載
      operationId: getDashboardTrends
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [30d, 90d, 1y]
            default: 30d
      responses:
        200: { description: 趨勢資料 }

  /super-admin/dashboard/alerts:
    get:
      tags: [Super Admin]
      summary: 系統異常警報清單
      operationId: getAlerts
      responses:
        200: { description: 異常警報列表 }

  /super-admin/users:
    get:
      tags: [Super Admin]
      summary: 用戶列表（搜尋/篩選）
      operationId: getUsers
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: plan
          in: query
          schema: { type: string, enum: [FREE, PRO_199, PRO_PLUS_399, ULTRA_1599] }
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, cooling] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        200: { description: 用戶列表 }

  /super-admin/users/export:
    get:
      tags: [Super Admin]
      summary: 批量匯出用戶 CSV
      operationId: exportUsers
      responses:
        200: { description: CSV 檔案下載 }

  /super-admin/users/{userId}:
    get:
      tags: [Super Admin]
      summary: 用戶詳情
      description: 基本資料、訂閱、使用行為、Token 消耗、登入紀錄、異常紀錄
      operationId: getUserDetail
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 用戶詳情 }

  /super-admin/users/{userId}/subscription:
    put:
      tags: [Super Admin]
      summary: 手動調整訂閱方案
      description: 僅 super_admin 可操作，即時生效，需二次密碼/OTP 確認
      operationId: adjustSubscription
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPlan, otpCode]
              properties:
                targetPlan: { type: string, enum: [FREE, PRO_199, PRO_PLUS_399, ULTRA_1599] }
                otpCode: { type: string }
      responses:
        200: { description: 訂閱已調整 }

  /super-admin/users/{userId}/suspend:
    post:
      tags: [Super Admin]
      summary: 停權帳號
      operationId: suspendUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        200: { description: 已停權 }

  /super-admin/users/{userId}/unsuspend:
    post:
      tags: [Super Admin]
      summary: 解除停權
      operationId: unsuspendUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 已解除停權 }

  /super-admin/finance/subscriptions:
    get:
      tags: [Super Admin]
      summary: 訂閱分布與 MRR 趨勢
      operationId: getSubscriptionStats
      responses:
        200: { description: 訂閱分布圓餅圖 + MRR 折線圖 }

  /super-admin/finance/transactions:
    get:
      tags: [Super Admin]
      summary: 交易紀錄
      operationId: getTransactions
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [success, failed, refunded] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        200: { description: 交易列表 }

  /super-admin/finance/refunds:
    get:
      tags: [Super Admin]
      summary: 退款申請佇列
      operationId: getRefundRequests
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        200: { description: 退款申請列表 }

  /super-admin/finance/refunds/{refundId}/approve:
    post:
      tags: [Super Admin]
      summary: 核准退款
      description: 觸發 Stripe Refund API，自動降級至 FREE，需二次密碼/OTP
      operationId: approveRefund
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otpCode]
              properties:
                otpCode: { type: string }
      responses:
        200: { description: 退款已核准 }

  /super-admin/finance/refunds/{refundId}/reject:
    post:
      tags: [Super Admin]
      summary: 駁回退款
      operationId: rejectRefund
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        200: { description: 退款已駁回，通知用戶 }

  /super-admin/finance/promo-codes:
    get:
      tags: [Super Admin]
      summary: 優惠碼列表
      operationId: getPromoCodes
      responses:
        200: { description: 優惠碼列表 }
    post:
      tags: [Super Admin]
      summary: 建立優惠碼
      operationId: createPromoCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, discountType, discountValue]
              properties:
                code: { type: string }
                discountType: { type: string, enum: [percentage, fixed_amount, free_trial_days] }
                discountValue: { type: number }
                applicablePlans: { type: array, items: { type: string } }
                maxUses: { type: integer }
                maxUsesPerUser: { type: integer, default: 1 }
                validFrom: { type: string, format: date-time }
                validUntil: { type: string, format: date-time }
      responses:
        201: { description: 優惠碼已建立 }

  /super-admin/moderation/abuse:
    get:
      tags: [Super Admin]
      summary: AI 濫用監控（冷卻中用戶列表）
      operationId: getAbuseMonitoring
      responses:
        200: { description: 冷卻中用戶與剩餘時間 }

  /super-admin/moderation/abuse/{userId}/unlock:
    post:
      tags: [Super Admin]
      summary: 手動解除冷卻
      operationId: unlockCooldown
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 已解除冷卻 }

  /super-admin/moderation/reports:
    get:
      tags: [Super Admin]
      summary: 內容檢舉佇列
      operationId: getContentReports
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, resolved, dismissed] }
      responses:
        200: { description: 檢舉列表 }

  /super-admin/moderation/reports/{reportId}/resolve:
    post:
      tags: [Super Admin]
      summary: 處理檢舉
      operationId: resolveReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [delete_and_warn, dismiss] }
                note: { type: string }
      responses:
        200: { description: 檢舉已處理 }

  /super-admin/settings/model-routing:
    get:
      tags: [Super Admin]
      summary: 取得 AI 模型路由設定
      operationId: getModelRouting
      responses:
        200: { description: 各方案模型設定 }
    put:
      tags: [Super Admin]
      summary: 更新 AI 模型路由設定
      description: 僅 super_admin
      operationId: updateModelRouting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                freeBasicModel: { type: string }
                freeFallbackModel: { type: string }
                proAdvancedModel: { type: string }
                proFallbackModel: { type: string }
                fallbackTimeoutMs: { type: integer }
      responses:
        200: { description: 已更新 }

  /super-admin/settings/plan-quotas:
    get:
      tags: [Super Admin]
      summary: 取得方案限額設定
      operationId: getPlanQuotas
      responses:
        200: { description: 各方案限額 }
    put:
      tags: [Super Admin]
      summary: 更新方案限額
      description: 僅 super_admin
      operationId: updatePlanQuotas
      responses:
        200: { description: 已更新 }

  /super-admin/settings/announcements:
    get:
      tags: [Super Admin]
      summary: 系統公告列表
      operationId: getAnnouncements
      responses:
        200: { description: 公告列表 }
    post:
      tags: [Super Admin]
      summary: 建立/排程系統公告
      operationId: createAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, type, displayMode]
              properties:
                title: { type: string }
                content: { type: string }
                type: { type: string, enum: [info, maintenance, feature, warning] }
                displayMode: { type: string, enum: [banner, notification, email] }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
      responses:
        201: { description: 公告已建立 }

  /super-admin/settings/feature-flags:
    get:
      tags: [Super Admin]
      summary: Feature Flags 列表
      operationId: getFeatureFlags
      responses:
        200: { description: Flag 列表 }
    post:
      tags: [Super Admin]
      summary: 建立 Feature Flag
      operationId: createFeatureFlag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flagKey]
              properties:
                flagKey: { type: string }
                description: { type: string }
                isEnabled: { type: boolean, default: false }
                rolloutPercentage: { type: integer, minimum: 0, maximum: 100, default: 0 }
                targetPlans: { type: array, items: { type: string } }
                targetUserIds: { type: array, items: { type: string, format: uuid } }
      responses:
        201: { description: Flag 已建立 }

  /super-admin/settings/feature-flags/{flagId}:
    put:
      tags: [Super Admin]
      summary: 更新 Feature Flag
      operationId: updateFeatureFlag
      parameters:
        - name: flagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isEnabled: { type: boolean }
                rolloutPercentage: { type: integer }
                targetPlans: { type: array, items: { type: string } }
                targetUserIds: { type: array, items: { type: string, format: uuid } }
      responses:
        200: { description: Flag 已更新 }

  /super-admin/settings/admins:
    get:
      tags: [Super Admin]
      summary: 管理員帳號列表
      operationId: getAdmins
      responses:
        200: { description: 管理員列表 }
    post:
      tags: [Super Admin]
      summary: 新增管理員
      description: 僅 super_admin
      operationId: createAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [super_admin, admin] }
      responses:
        201: { description: 管理員已建立 }

  /super-admin/audit-logs:
    get:
      tags: [Super Admin]
      summary: 稽核日誌（唯讀）
      operationId: getAuditLogs
      parameters:
        - name: adminId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
      responses:
        200: { description: 稽核日誌列表（append-only） }

  # ----------------------------------------------------------
  # 13 - 個人儀表板與成就系統
  # ----------------------------------------------------------
  /dashboard:
    get:
      tags: [Dashboard]
      summary: 儀表板首頁資料
      description: 含科目切換器、雷達圖、倒數計時、任務模式、指標卡片
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/SubjectId'
      responses:
        200: { description: 儀表板完整資料 }

  /dashboard/streaks:
    get:
      tags: [Dashboard]
      summary: 連勝記錄
      operationId: getStreaks
      responses:
        200: { description: 連續天數、冰凍保護狀態 }

  /dashboard/quests:
    get:
      tags: [Dashboard]
      summary: 每日微任務
      operationId: getDailyQuests
      responses:
        200: { description: 今日任務列表（1-3 項） }

  /dashboard/achievements:
    get:
      tags: [Dashboard]
      summary: 成就徽章列表
      operationId: getAchievements
      responses:
        200: { description: 已解鎖與未解鎖徽章 }

  # ----------------------------------------------------------
  # 15 - Onboarding
  # ----------------------------------------------------------
  /onboarding/status:
    get:
      tags: [Onboarding]
      summary: 取得 Onboarding 狀態
      operationId: getOnboardingStatus
      responses:
        200: { description: onboardingCompleted 狀態 + 暫存資料 }

  /onboarding/complete:
    post:
      tags: [Onboarding]
      summary: 完成 Onboarding
      description: 為每個備考科目建立獨立學習歷程，初始化排程
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjects]
              properties:
                displayName: { type: string }
                subjects:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [subjectId, examDate, selfAssessedLevel]
                    properties:
                      subjectId: { type: string, format: uuid }
                      examDate: { type: string, format: date }
                      selfAssessedLevel: { type: string, enum: [beginner, intermediate, advanced] }
                dailyStudyMinutes: { type: integer, default: 30 }
                learningPreference: { type: string, enum: [drill, concept, mixed], default: mixed }
      responses:
        200: { description: Onboarding 完成，已初始化學習歷程 }
        400: { description: 至少需選擇一個科目 }

  /subjects/categories:
    get:
      tags: [Onboarding]
      summary: 科目分類列表
      security: []
      operationId: getSubjectCategories
      responses:
        200: { description: 分類列表（IT/金融/語言/醫療/公務員/其他） }

  /subjects/search:
    get:
      tags: [Onboarding]
      summary: 搜尋科目
      operationId: searchSubjects
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        200: { description: 科目搜尋結果 }

  # ----------------------------------------------------------
  # Profile
  # ----------------------------------------------------------
  /profile:
    get:
      tags: [Profile]
      summary: 取得個人資料
      operationId: getProfile
      responses:
        200: { description: 個人資料 }
    put:
      tags: [Profile]
      summary: 更新個人資料
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                age: { type: integer }
                education: { type: string }
                career: { type: string }
      responses:
        200: { description: 已更新 }

  /profile/avatar:
    put:
      tags: [Profile]
      summary: 上傳大頭貼
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        200: { description: 大頭貼已更新 }

  /profile/subjects:
    post:
      tags: [Profile]
      summary: 新增備考科目
      operationId: addSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, examDate, selfAssessedLevel]
              properties:
                subjectId: { type: string, format: uuid }
                examDate: { type: string, format: date }
                selfAssessedLevel: { type: string, enum: [beginner, intermediate, advanced] }
      responses:
        201: { description: 科目已新增，學習歷程已建立 }

  /profile/subjects/{subjectId}:
    put:
      tags: [Profile]
      summary: 更新備考科目設定
      operationId: updateSubject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                examDate: { type: string, format: date }
                selfAssessedLevel: { type: string, enum: [beginner, intermediate, advanced] }
      responses:
        200: { description: 已更新 }
    delete:
      tags: [Profile]
      summary: 移除備考科目
      description: 學習紀錄封存而非刪除
      operationId: removeSubject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: 科目已移除（紀錄封存） }
