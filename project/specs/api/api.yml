                $ref: '#/components/schemas/ShareCardResponse'

  # ----------------------------------------------------------
  # 07 - Review & AI Coach (錯題複習與AI教練) @query
  # ----------------------------------------------------------
  /reviews/errors:
    get:
      tags: [Reviews]
      summary: 取得錯題清單
      operationId: getErrorQuestions
      parameters:
        - name: subjectId
          in: query
          schema: { type: string }
        - name: examId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 錯題列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorQuestionResponse'
        '403':
          description: 無存取此錯題記錄的權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reviews/errors/{questionId}/analysis:
    get:
      tags: [Reviews]
      summary: 取得錯題詳細解析
      description: FREE 用戶取得簡短提示+鎖定狀態，PRO+ 取得完整 Markdown 解析+溯源引用
      operationId: getErrorAnalysis
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 解析內容（依方案差異化）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorQuestionResponse'
        '404':
          description: 題目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reviews/errors/{questionId}/chat:
    post:
      tags: [Reviews]
      summary: 與 AI 教練對話（錯題上下文）
      description: 僅 PRO 以上可用。Streaming 回應。10分鐘內5次超綱觸發30分鐘冷卻。
      operationId: chatAboutError
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: AI 教練回應（streaming）
        '403':
          description: AI 教練對話為 PRO 以上方案專屬功能
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 您已暫時被限制使用 AI 教練，請 30 分鐘後再試
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

